<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#121212"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bungalow Supplies</title>
<style>
:root{--bg:#121212;--card:#1c1c1e;--card2:#242426;--line:#2c2c2e;--txt:#f2f2f2;--mut:#9a9a9f;--or:#ff7726;--or2:#ffb347;--nav:62px;--bar:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
body{background:radial-gradient(ellipse at 50% 0,#2a1a10 0,var(--bg) 55%) fixed var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(255,119,38,.6);outline-offset:0}
.hero{position:relative;height:150px;background:url(banner.webp) center 58%/cover;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,18,18,.55) 0,rgba(18,18,18,.05) 40%,rgba(18,18,18,.15) 70%,var(--bg) 100%)}
.top{position:absolute;z-index:1;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 0}
.stir{flex:0 0 auto;width:58px;height:58px;border-radius:50%;object-fit:cover;background:#000;border:2.5px solid var(--or);box-shadow:0 0 0 3px rgba(255,119,38,.18),0 0 16px rgba(255,119,38,.75);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,119,38,.3),0 0 26px rgba(255,119,38,.95)}}
.top h1{flex:1;margin:0;font-size:25px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px rgba(255,119,38,.55),0 2px 6px #000}
.badge{flex:0 0 auto;font-size:13px;font-weight:700;padding:5px 11px;border-radius:9px;border:1px solid;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.b-synced{background:#1f5f2c;border-color:#3fa34d;color:#d6ffd9}.b-offline{background:#3a2a12;border-color:#c98a2c;color:#ffd99a}
.b-syncing{background:#24324a;border-color:#4f86d6;color:#d9e8ff}.b-local{background:#2c2c2e;border-color:#ff7726;color:#ffd2b3}
.logo{position:absolute;z-index:1;right:12px;bottom:10px;width:26px;height:26px;border-radius:7px;opacity:.85;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.chips{position:sticky;top:0;z-index:5;display:flex;gap:7px;overflow-x:auto;padding:8px 12px;background:rgba(18,18,18,.92);backdrop-filter:blur(8px);scrollbar-width:none;margin-top:-6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:32px;padding:0 13px;border-radius:16px;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:6px}
.chip.on{outline:2px solid var(--or);outline-offset:1px;box-shadow:0 0 12px rgba(255,119,38,.6)}
.chip .n{font-size:11px;opacity:.8;font-weight:700}
.chip.add{border:1px dashed #777;color:#ddd;background:transparent}
main{padding:2px 12px calc(var(--nav) + var(--bar) + 30px + env(safe-area-inset-bottom))}
.cat{margin:14px 4px 6px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.cat small{font-size:12px;color:var(--mut);font-weight:600}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;min-height:60px;border-top:1px solid var(--line);user-select:none;-webkit-user-select:none;transition:opacity .35s,transform .35s}
.row:first-child{border-top:0}
.tick{flex:0 0 52px;height:60px;display:flex;align-items:center;justify-content:center}
.tick i{width:26px;height:26px;border-radius:50%;border:2px solid #8a8a8f;display:flex;align-items:center;justify-content:center}
.dot{flex:0 0 12px;height:12px;border-radius:50%;margin-right:12px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.nm{flex:1;min-width:0;padding:8px 0;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.nm b{font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:13px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{flex:0 0 44px;height:44px;border-radius:50%;background:var(--card2);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;margin-left:6px;border:1px solid #333}
.st:active{background:#3a3a3c}
.more{flex:0 0 34px;height:60px;color:var(--mut);font-size:20px}
.row.done .nm b{text-decoration:line-through;color:var(--mut)}.row.done .tick i{background:var(--or);border-color:var(--or)}
.row.done{opacity:.35;transform:translateX(30px)}
.rb{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rb>button{width:100%;min-height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:16px;font-weight:600}
.rb .row b{color:var(--mut);text-decoration:line-through;font-weight:400}
.readd{flex:0 0 auto;height:40px;padding:0 14px;margin-right:8px;border-radius:20px;background:rgba(255,119,38,.15);border:1px solid rgba(255,119,38,.5);color:#ffb98a;font-weight:600;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:36px 20px}.empty b{display:block;color:var(--txt);font-size:18px;margin-bottom:6px}
.bar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:6;padding:8px 12px;background:linear-gradient(0deg,var(--bg) 70%,rgba(18,18,18,0))}
.inbox{display:flex;align-items:center;background:var(--card);border:1px solid #3a3a3c;border-radius:16px;height:52px;padding-left:4px}
.inbox input{flex:1;border:0;background:transparent;font-size:17px;min-width:0;height:50px}
.inbox input:focus{outline:0}.inbox:focus-within{border-color:var(--or);box-shadow:0 0 12px rgba(255,119,38,.35)}
.ib{flex:0 0 48px;height:48px;display:flex;align-items:center;justify-content:center;color:#ddd}
.ib.dis{opacity:.28;pointer-events:none}.ib.live{color:var(--or);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.sep{width:1px;height:26px;background:#444}
.sug{position:absolute;left:12px;right:12px;bottom:66px;background:#202022;border:1px solid #3a3a3c;border-radius:14px;overflow:hidden;box-shadow:0 -6px 20px rgba(0,0,0,.6)}
.sug button{display:flex;width:100%;text-align:left;min-height:50px;padding:8px 14px;align-items:center;gap:10px;border-top:1px solid var(--line);font-size:16px}
.sug button:first-child{border-top:0}.sug small{color:var(--mut);font-size:13px;margin-left:auto;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:#161618;border-top:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:#aaa}
nav button.on{color:var(--or)}nav button.on svg{filter:drop-shadow(0 0 5px rgba(255,119,38,.8))}
.page{display:none}.page.on{display:block}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--or);margin:18px 4px 8px;text-shadow:0 0 8px rgba(255,119,38,.4)}
.hint{color:var(--mut);font-size:14px;margin:0 4px 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;min-height:74px;text-align:left;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.tile b{font-weight:600;font-size:16px;padding-right:22px}.tile span{font-size:13px;color:var(--mut);margin-top:3px}
.tile.onl{border-color:rgba(63,163,77,.6);background:#18251a}.tile.onl span{color:#8fd19a}
.tile .x{position:absolute;right:2px;top:2px;width:36px;height:36px;color:var(--mut);font-size:18px}
.addrow{display:flex;gap:8px;margin-bottom:10px}.addrow input{flex:1;min-width:0}
.btn{min-height:46px;padding:0 16px;border-radius:12px;background:var(--card2);border:1px solid #3a3a3c;font-weight:600}
.btn.p{background:var(--or);border-color:var(--or);color:#1a0d04}.btn.d{color:#ff8a80;border-color:#5a2a2a}
.meal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.meal.today{border-color:rgba(255,119,38,.6);box-shadow:inset 0 0 18px rgba(255,119,38,.08)}
.meal .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--or2)}
.meal .dh small{color:var(--mut);font-weight:500}
.meal input,.meal textarea{width:100%;margin-bottom:8px}.meal textarea{min-height:70px;resize:vertical}
.meal .ma{display:flex;justify-content:space-between;align-items:center;gap:8px}.meal .ma span{color:#8fd19a;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.srow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}.srow:first-child{border-top:0}
.srow input[type=text]{flex:1;min-width:0;padding:10px}.srow input[type=color]{width:46px;height:44px;padding:2px;border-radius:10px}
.srow .rm{width:44px;height:44px;color:#ff8a80;font-size:20px}
.ord{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 4px;border-top:1px solid var(--line);background:var(--card);touch-action:none}
.ord:first-child{border-top:0}.ord .h{width:40px;height:48px;color:var(--mut);font-size:22px;cursor:grab;touch-action:none}
.ord .sw{flex:0 0 14px;width:14px;height:14px;border-radius:4px}.ord span{flex:1}.ord .ud{width:40px;height:44px;color:#bbb}
.ord.drag{position:relative;z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.7);background:#2a2a2c;border-radius:10px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92vh;overflow:auto;background:#1b1b1d;border-top:2px solid var(--or);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(255,119,38,.15)}
.sheet h3{margin:0 0 12px;font-size:19px}.sheet label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%}.sheet .two{display:flex;gap:8px}.sheet .two>*{flex:1}
.sheet .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.sheet .acts .btn{flex:1}
.qty{display:flex;align-items:center;gap:8px}.qty output{min-width:52px;text-align:center;font-size:20px;font-weight:700}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--bar) + 14px + env(safe-area-inset-bottom));z-index:30;background:#2a2a2c;border:1px solid #444;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.6);font-size:15px}
.toast span{flex:1}.toast button{min-height:42px;padding:0 14px;color:var(--or);font-weight:700}
#setup{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
#setup .in{padding:18px}#setup h2{margin-top:6px}#setup p{color:#cfcfd4;line-height:1.45}
#setup input{width:100%;margin:6px 0 10px;font-size:18px}#setup .btn{width:100%;margin-top:6px;min-height:52px;font-size:17px}
.err{color:#ff8a80;min-height:20px;font-size:14px}
@media(min-width:700px){body{max-width:560px;margin:0 auto}.bar,nav,.toast{max-width:560px;margin:0 auto}}

.print-bar{display:flex;justify-content:flex-end;padding:0 12px 8px}
.print-btn{min-height:40px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid #3a3a3c;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.print-btn:active{background:var(--card2)}
.print-btn svg{flex:0 0 auto}
#print-sheet{display:none;color:#000;background:#fff;font:11pt/1.25 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;width:190mm}
#print-sheet .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 3mm;padding:0 0 2mm;border-bottom:0.3mm solid #000}
#print-sheet .ph h1{flex:1;margin:0;font-size:1.15em;font-weight:800;letter-spacing:0;color:#000;text-shadow:none;white-space:normal;overflow:visible}
#print-sheet .ph .dt{font-size:.95em;font-weight:600;white-space:nowrap}
#print-sheet .shops{display:grid;grid-template-columns:repeat(var(--print-cols,2),minmax(0,1fr));gap:3mm 3.5mm;align-items:start}
#print-sheet .shop{break-inside:avoid;page-break-inside:avoid;border:0.4mm dashed #000;padding:var(--print-pad,2.2mm) 2.4mm 2mm;margin:0;border-radius:1.5mm;background:#fff;position:relative}
#print-sheet .shop h2{display:flex;align-items:center;gap:1.5mm;font-size:1em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#000;margin:0 0 1.6mm;text-shadow:none}
#print-sheet .cut{font-size:1em;font-weight:400;letter-spacing:0;text-transform:none;line-height:1}
#print-sheet .pi{display:flex;align-items:flex-start;gap:1.6mm;margin:0 0 .85mm;break-inside:avoid}
#print-sheet .box{flex:0 0 auto;font-size:1.05em;line-height:1.2}
#print-sheet .pn{min-width:0}
#print-sheet .pn b{font-weight:600;font-size:1em}
#print-sheet .pn i{display:block;font-style:normal;font-size:.85em;color:#000}
@media print{
 @page{size:A4 portrait;margin:10mm}
 html,body{background:#fff !important;color:#000 !important;margin:0 !important;max-width:none !important;width:auto !important}
 body>*:not(#print-sheet){display:none !important}
 #print-sheet{display:block !important;position:static !important;left:auto !important;top:auto !important;width:100% !important;visibility:visible !important;background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){.stir{animation:none}.row{transition:none}}
</style></head><body>
<header class="hero"><div class="top"><img class="stir" src="stirling.gif" alt="Stirling"><h1>Bungalow Supplies</h1><span id="badge" class="badge b-local">Local</span></div><img class="logo" src="logo.webp" alt=""></header>
<div class="chips" id="chips"></div>
<div class="print-bar"><button type="button" class="print-btn" id="print-list" aria-label="Print shopping list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>Print list</button></div>
<main>
 <section class="page on" id="p-list"><div id="list"></div></section>
 <section class="page" id="p-staples"></section>
 <section class="page" id="p-meals"></section>
 <section class="page" id="p-settings"></section>
</main>
<div class="bar" id="bar"><div class="sug" id="sug" hidden></div>
 <div class="inbox"><input id="add" type="text" placeholder="Add item…" autocomplete="off" autocorrect="on" autocapitalize="sentences" enterkeyhint="enter" aria-label="Add item">
 <button class="ib" id="mic" aria-label="Voice input"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
 <span class="sep"></span><span class="ib dis" title="Barcode scanning — coming in version 2" aria-hidden="true"><svg width="26" height="22" viewBox="0 0 26 22" fill="currentColor"><rect x="1" y="2" width="2" height="18"/><rect x="5" y="2" width="1" height="18"/><rect x="8" y="2" width="3" height="18"/><rect x="13" y="2" width="1" height="18"/><rect x="16" y="2" width="2" height="18"/><rect x="20" y="2" width="1" height="18"/><rect x="23" y="2" width="2" height="18"/></svg></span></div></div>
<nav id="nav">
 <button data-p="list" class="on"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>List</button>
 <button data-p="staples"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>Staples</button>
 <button data-p="meals"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Meals</button>
 <button data-p="settings"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="setup" hidden></div>
<script src="config.js?v=202611151802"></script><script src="sync.js?v=202611151802"></script><script src="app.js?v=202611151802"></script>
